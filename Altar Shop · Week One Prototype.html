<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altar Shop · Week One Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFE4FB; --paper2:#E3D2F7; --ink:#3B2160; --ink-soft:#6E5A8C; --pink:#FF7EBB; --pink-soft:#FFD3E8;
  --butter:#FFE58A; --mint:#A6E8D3; --peri:#AEB8F5; --card:#FBF6FF; --line:#3B2160; --bad:#C2456B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1F1533; --paper2:#2A1D45; --ink:#F1E6FF; --ink-soft:#BCA8DA; --pink:#FF8FC7; --pink-soft:#55284A;
    --butter:#E8C95A; --mint:#5FB9A0; --peri:#7C87D6; --card:#2C2048; --line:#CDB6F0; --bad:#FF7A9C;
  }
}
:root[data-theme="dark"]{
  --paper:#1F1533; --paper2:#2A1D45; --ink:#F1E6FF; --ink-soft:#BCA8DA; --pink:#FF8FC7; --pink-soft:#55284A;
  --butter:#E8C95A; --mint:#5FB9A0; --peri:#7C87D6; --card:#2C2048; --line:#CDB6F0; --bad:#FF7A9C;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'Mali','Comic Neue','Trebuchet MS',sans-serif;font-size:15px;line-height:1.5;
  background-image:radial-gradient(var(--paper2) 1.5px,transparent 1.5px);background-size:18px 18px}
h1,h2,h3,.px{font-family:'Pixelify Sans','Courier New',monospace;font-weight:600;letter-spacing:.01em}
h1{font-size:24px;margin:0}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:16px;margin:12px 0 6px}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
button:hover{background:var(--pink-soft)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
button.main{background:var(--pink);color:#2B0F2A;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
select,input{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:4px;padding:5px 8px}
.wrap{max-width:1280px;margin:0 auto;padding:12px}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:6px;padding:10px 14px;box-shadow:4px 4px 0 var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.sky{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.sky span{white-space:nowrap}
.hour{display:flex;gap:4px}
.hour i{font-style:normal;padding:2px 7px;border:2px solid var(--line);border-radius:3px;font-family:'Pixelify Sans',monospace;font-size:13px;opacity:.45}
.hour i.on{background:var(--butter);opacity:1;color:#3B2160}
.stars{color:var(--pink);font-size:18px;letter-spacing:1px}
.tabs{display:none;gap:6px;margin:12px 0}
.tabs button{flex:1}
.tabs button[aria-pressed="true"]{background:var(--butter);color:#3B2160}
.stage{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:14px;margin-top:14px;align-items:start}
.panel{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:12px;box-shadow:4px 4px 0 var(--line);min-width:0}
.panel>h2{display:flex;justify-content:space-between;align-items:baseline}
.panel small{color:var(--ink-soft)}
@media (max-width:1000px){.tabs{display:flex}.stage{grid-template-columns:1fr}.stage>.panel{display:none}.stage>.panel.show{display:block}}
details{border-top:2px dashed var(--paper2);padding:4px 0}
summary{cursor:pointer;font-weight:600;padding:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0 6px}
.chip{font-size:13px;padding:3px 8px;box-shadow:2px 2px 0 var(--line);border-width:2px}
.chip.on{background:var(--mint);color:#173B30}
.chip .n{font-family:'Pixelify Sans',monospace;margin-left:4px;opacity:.8}
.counter{border:2px solid var(--line);border-radius:6px;padding:12px;background:var(--paper);margin-bottom:12px;min-height:120px}
.who{display:flex;align-items:center;gap:10px}
.aura{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;box-shadow:0 0 0 4px color-mix(in srgb, var(--aura) 35%, transparent)}
.say{margin:8px 0;font-style:italic}
.req{background:var(--card);border:2px dashed var(--line);border-radius:4px;padding:6px 8px;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.altar{border:2px solid var(--line);border-radius:50% 50% 6px 6px / 22% 22% 6px 6px;padding:16px 12px 12px;background:linear-gradient(var(--paper2),var(--paper))}
.plates{min-height:54px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:8px;border:2px dashed var(--ink-soft);border-radius:30px;margin:8px 0}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.slot{border:2px solid var(--line);border-radius:4px;padding:6px;background:var(--card);text-align:center;min-height:44px}
.result{margin-top:12px;border:2px solid var(--line);border-radius:6px;padding:10px;background:var(--card)}
.result .g{font-family:'Pixelify Sans',monospace;font-size:18px}
.log{max-height:160px;overflow:auto;font-size:13px;color:var(--ink-soft);border-top:2px dashed var(--paper2);margin-top:10px;padding-top:6px}
.swatch{width:26px;height:26px;border-radius:50% 50% 4px 4px;border:2px solid var(--line);padding:0;box-shadow:2px 2px 0 var(--line)}
.swatch.on{outline:3px solid var(--pink);outline-offset:2px}
.modal{position:fixed;inset:0;background:color-mix(in srgb, #1A0F2E 55%, transparent);display:none;align-items:flex-start;justify-content:center;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 14px) 10px calc(env(safe-area-inset-bottom,0px) + 14px);overflow:auto}
.modal.open{display:flex}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:8px;box-shadow:6px 6px 0 var(--line);width:min(1100px,100%);padding:14px}
.booktabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.booktabs button[aria-pressed="true"]{background:var(--butter);color:#3B2160}
.bookgrid{display:grid;grid-template-columns:1fr 260px;gap:14px}
@media (max-width:760px){.bookgrid{grid-template-columns:1fr}}
.entries{max-height:62vh;overflow:auto;padding-right:6px}
.entry{border-bottom:2px dotted var(--paper2);padding:6px 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.entry b{min-width:150px}
.entry.locked b::after{content:" ✦";color:var(--pink)}
.blank{min-width:70px;border-bottom:2px solid var(--ink);padding:0 6px;cursor:pointer;background:none;box-shadow:none;border-top:0;border-left:0;border-right:0;border-radius:0}
.blank.filled{background:var(--pink-soft)}
.word{font-size:13px;padding:2px 7px;box-shadow:2px 2px 0 var(--line)}
.word.sel{background:var(--butter);color:#3B2160}
.bank{border:2px solid var(--line);border-radius:6px;padding:8px;background:var(--paper)}
.letter{background:var(--paper);border:2px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px;max-width:68ch}
.recipe{border:2px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--paper)}
.recipe.locked{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.muted{color:var(--ink-soft)}
.receipts{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px}
.receipt{font-family:'Courier New',monospace;font-size:13px;background:#FFFDF7;color:#2B2233;border:1px dashed #8C7FA3;padding:8px 10px;width:220px;box-shadow:2px 2px 0 var(--line)}
.receipt hr{border:0;border-top:1px dashed #8C7FA3;margin:5px 0}
.receipt .rh{font-weight:bold;text-align:center}
.receipt .rs{color:#C2456B;font-size:16px;letter-spacing:1px;margin-top:4px}
.autobar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 60px);transform:translateX(-50%);background:var(--card);border:2px solid var(--line);border-radius:4px;padding:6px 10px;z-index:25;box-shadow:3px 3px 0 var(--line);white-space:nowrap}
.autobar[hidden]{display:none}
.entries h3.cat{margin:14px 0 4px;padding-bottom:2px;border-bottom:2px solid var(--line)}
.cue{font-style:italic;color:var(--ink-soft);margin:8px 0 0;font-size:14px}
.tale{background:var(--pink-soft);border-radius:4px;padding:6px 8px;margin:6px 0;font-size:14px}
.bookline{flex-basis:100%;font-size:13px;font-style:italic;color:var(--ink-soft);padding-left:2px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--butter);color:#3B2160;border:2px solid #3B2160;border-radius:4px;padding:6px 12px;z-index:30;display:none}
@media (prefers-reduced-motion: no-preference){.sparkle{animation:spk .9s ease-out}@keyframes spk{0%{box-shadow:0 0 0 0 var(--butter)}100%{box-shadow:0 0 0 14px transparent}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Altar Shop</h1><small class="muted">Week one prototype</small></div>
    <div class="sky" id="sky"></div>
    <div class="row"><span class="stars" id="stars" aria-label="Shop rating"></span>
      <button id="restartBtn" title="Start the week again from Day 1">Restart</button><button id="booksBtn">Books</button><button id="nextBtn" class="main">Next hour</button></div>
  </header>
  <nav class="tabs" aria-label="Shop areas">
    <button data-p="left">Kitchen</button><button data-p="mid" aria-pressed="true">Altar</button><button data-p="right">Cabinet</button>
  </nav>
  <main class="stage">
    <section class="panel" id="left"><h2>Kitchen <small>herbs, waters, pantry</small></h2><div id="leftBody"></div></section>
    <section class="panel show" id="mid">
      <div class="counter" id="counter"></div>
      <div class="altar">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">Altar</h2>
          <label class="row" style="gap:6px"><span class="muted">Making</span><select id="target"></select></label></div>
        <div class="plates" id="plates"><span class="muted">Tap ingredients on the shelves to lay them here.</span></div>
        <div class="slots"><div class="slot" id="candleSlot"></div><div class="slot" id="tarotSlot"></div></div>
        <div class="row" style="justify-content:center">
          <button id="testBtn">Test craft</button><button id="giveBtn" class="main">Make and give</button><button id="clearBtn">Clear altar</button>
        </div>
      </div>
      <div class="result" id="result" hidden></div>
      <div class="log" id="log" aria-live="polite"></div>
    </section>
    <section class="panel" id="right"><h2>Cabinet <small>crystals, candles, cards</small></h2><div id="rightBody"></div></section>
  </main>
</div>

<div class="modal" id="books" role="dialog" aria-modal="true" aria-label="Books">
  <div class="sheet">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Bookshelf</h2><button id="closeBooks">Close</button></div>
    <div class="booktabs" id="booktabs"></div>
    <div class="bookgrid"><div><input id="search" placeholder="Search this book" style="width:100%;margin-bottom:8px"><div class="entries" id="entries"></div></div>
      <aside class="bank"><h3 style="margin-top:0">Word bank</h3><p class="muted" style="margin:0 0 6px;font-size:13px">Pick a word, then tap a blank. To clear a blank, tap it with no word picked.</p><div class="chips" id="bank"></div></aside></div>
  </div>
</div>
<div class="modal" id="dayEnd" role="dialog" aria-modal="true" aria-label="End of day"><div class="sheet" id="dayEndBody" style="max-width:560px"></div></div>
<div class="toast" id="toast"></div>
<div class="autobar" id="autoBar" hidden><span id="autoMsg"></span> <button id="stayBtn">Stay</button></div>

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2200)}

const today=()=>D.cal[S.day-1];

/* ---------- conditions ---------- */
function met(c){const T=today(),hr=HOURS[S.h];

function condClue(c,themes){const hr=S.h;
  switch(c.t){

    case 'phase':case 'pg':case 'dark':{let w='a different moon';const v=c.t==='pg'?c.v:c.v;
      if(c.t==='dark'||v==='New Moon')w='a new moon';else if(v==='Full Moon')w='a full moon';else if(c.v==='waxing'||WAX.includes(v))w='a growing moon';else if(c.v==='waning'||WAN.includes(v))w='a shrinking moon';
      return[`It glows faintly, waiting for ${w}.`,[]]}
    case 'time':{const need=HOURS.indexOf(c.v);return[hr<need?'It feels half-awake. Too early in the day?':'It feels sleepy. Too late in the day?',[]]}
    case 'weather':return[`It longs for ${WEATHERLINE[c.v]||'different weather'}.`,[]];
    case 'afterrain':return['It longs for the fresh air after rain.',[]];

    case 'sabbat':return['It hums like a festival song, but not today\u2019s.',[]];
    case 'named':return['It is waiting for one particular full moon.',[]];}
  return['Something about the moment is wrong.',[]]}

/* ---------- crafting ---------- */
function isBaseFor(n,type){const i=ITEM[n];return i&&(i.anybase||i.base.includes(type))}
/* A swap is a wrong ingredient that shares a property with a missing one. It counts as one problem. */
function findSwaps(r,missing,wrong){const left=[...missing],out=[];
  wrong.forEach(w=>{const wp=ITEM[w]?.props||[];let best=null,bn=0;
    left.forEach(m=>{const n=(ITEM[m]?.props||[]).filter(p=>wp.includes(p)).length;if(n>bn){bn=n;best=m}});
    if(!best)return;left.splice(left.indexOf(best),1);
    const mp=ITEM[best].props,shared=mp.filter(p=>wp.includes(p));
    const kw=r.themes.find(t=>shared.includes(t))||shared[0];
    const a=ITEM[best],b=ITEM[w];let kind='same';
    if(a.t&&b.t&&a.t!==b.t)kind=a.t+'>'+b.t;else if(a.s&&b.s&&a.s!==b.s)kind=a.s==='Gentle'?'strong':'weak';
    out.push({want:best,got:w,kw,kind})});
  return out}
function swapLine(sw){const a=SWAPLINES[sw.kind];return a[Math.floor(Math.random()*a.length)].replace('{k}',sw.kw)}
function evaluate(r,test){
  const used=[...new Set(S.altar)],need=r.ing;
  const missing=need.filter(x=>!used.includes(x)),wrong=used.filter(x=>!need.includes(x));
  const swaps=findSwaps(r,missing,wrong);
  const loneMissing=missing.filter(m=>!swaps.some(s=>s.want===m)),loneWrong=wrong.filter(w=>!swaps.some(s=>s.got===w));
  let probs=swaps.length+loneMissing.length+loneWrong.length;const lines=[];const gained=[];
  if(swaps.length)lines.push(swapLine(swaps[0]));
  else if(loneMissing.length===1)lines.push('Something small is missing.');else if(loneMissing.length>1)lines.push('Several things are missing. It feels half-made.');
  else if(loneWrong.length){const w=loneWrong[0],props=(ITEM[w]?.props||[]).filter(p=>!r.themes.includes(p));
    if(props.length){lines.push(`A stray note of ${props[0]} runs through it. It doesn\u2019t belong here.`);gained.push(props[0])}
    else lines.push('It has the right idea, but one ingredient isn\u2019t the one it wants.')}
  let cl='';
  if(r.candle&&!S.candle){probs++;cl='It feels as if it was made in the dark.'}
  else if(r.candle&&S.candle!==r.candle){probs++;cl=`The ${S.candle.toLowerCase()} flame flickers uneasily.`}
  else if(!r.candle&&S.candle){probs++;cl='The candle burned on, ignored.'}
  let tl='';
  if(r.tarot&&!S.tarot){probs++;tl='It feels unguided, as if waiting for a card.'}
  else if(r.tarot&&S.tarot!==r.tarot){probs++;tl=`${S.tarot} turned its face away.`}
  else if(!r.tarot&&S.tarot){probs++;tl='The card stayed silent.'}
  if(cl||tl)lines.push([cl,tl].filter(Boolean).join(' '));
  const unmet=r.conds.filter(c=>!met(c));probs+=unmet.length;
  if(unmet.length){const[t,g]=condClue(unmet[0],r.themes);lines.push(t);if(test)gained.push(...g)}
  const grade=probs===0?'Perfect':probs===1?'Good':probs<=3?'Clumsy':'Failed';
  if(test){const came=new Set();
    need.filter(x=>used.includes(x)&&!isBaseFor(x,r.type)).forEach(x=>(ITEM[x]?.props||[]).forEach(p=>r.themes.includes(p)&&came.add(p)));
    if(r.candle&&S.candle===r.candle)(D.colours[r.candle]||[]).forEach(p=>r.themes.includes(p)&&came.add(p));
    if(r.tarot&&S.tarot===r.tarot)(D.tarot[r.tarot]||[]).forEach(p=>r.themes.includes(p)&&came.add(p));
    swaps.forEach(s=>r.themes.includes(s.kw)&&came.add(s.kw));
    const c=[...came].slice(0,3);if(c.length){lines.push(`You can feel ${c.join(', ').replace(/, ([^,]*)$/,' and $1')} in it.`);gained.push(...c)}}
  return{grade,lines:lines.slice(0,test?4:3),gained,probs,swaps}}
/* Which reaction a customer reports: by grade, and for Good by the kind of miss. */

function reactionFor(v,r,kind){const tKind=kind.includes('>');

    if(tKind&&(v.usual==='any'||v.usual===kind.split('>')[0]))return v.react.target}

function pickLine(g){const a=D.grades[g];return a[Math.floor(Math.random()*a.length)]}

/* ---------- visitors ---------- */
function slotVisitors(){const d=S.day,h=HOURS[S.h];

/* Star rating is the average of the last 20 deliveries and advice answers. */
const SCORE={Perfect:5,Good:4,Clumsy:2,Failed:1,Missed:1};

function talesHTML(q){return (q.tales||[]).map(t=>`<p class="tale">${t.own?'<b>About last time:</b> ':`<b>Word from ${esc(t.who.replace(/^(A|An|Two) /,m=>m.toLowerCase()))}:</b> `}${esc(t.text)}</p>`).join('')}

const GATHER=[['Moonwater',()=>today().phase==='Full Moon'&&HOURS[S.h]==='Nightfall','Full Moon, Nightfall'],

function doCraft(test){const r=D.recipes[S.target];if(!r||!S.altar.length)return;
  if(!test){const lacking=S.altar.filter(n=>X.stock[n]!==undefined&&S.stock[n]<=0);
    if(lacking.length){toast(`No ${lacking[0]} left. Fill a bottle first.`);return}
    S.altar.forEach(n=>{if(X.stock[n]!==undefined)S.stock[n]--})}
  const ev=evaluate(r,test);
  if(test){S.tests--;addWords(ev.gained);S.result={grade:ev.grade,first:pickLine(ev.grade),lines:ev.lines,test:true};log(`Test craft of ${r.name}.`)}
  else{const q=S.queue;let v;
    if(q.type==='return'){const o=S.orders.find(o=>o.id===q.oid);o.status='done';v=visitByKey(o.key)}else{v=visitByKey(q.key);S.seen[q.key]=true;S.activeNow=null}
    /* Every order has exactly one right recipe; making a different one fails, however well it is made. */
    if(String(v.rid)!==String(r.id))ev.grade='Failed';
    S.stats[ev.grade.toLowerCase()]++;record(ev.grade,v.who,`#${r.id} ${r.name} (${r.type})`);
    const lines=[];
    if(ev.grade==='Perfect'){lines.push(v.hint.text);addWords(v.hint.words)}
    else{tell(v,ev.grade==='Good'?reactionFor(v,r,missKind(ev)):v.oops);lines.push('They thank you and take it home.')}
    S.result={grade:ev.grade,first:'',lines,test:false};log(`Gave ${r.name} to ${v.who}.`);S.queue=null}
  if(!test){S.altar=[];S.candle='';S.tarot=''}  /* a test craft leaves the altar laid out */
  render()}
function nextHour(auto){
  if(S.queue){const q=S.queue;
    if(q.type==='new'&&visitByKey(q.key).back&&S.activeNow!==q.key)takeOrder(visitByKey(q.key));
    else if(q.type==='new'){const v=visitByKey(q.key);S.seen[q.key]=true;
      if(S.activeNow===q.key||v.kind!=='advice'){S.stats.missed++;record('Missed',v.who,'No sale');log(`${v.who} left without anything.`)}S.activeNow=null}
    else{const o=S.orders.find(o=>o.id===q.oid);o.status='missed';S.stats.missed++;record('Missed',visitByKey(o.key).who,'No sale');log('A customer left without their order.')}
    S.queue=null}
  if(!auto)S.result=null;
  if(S.h<3){S.h++;render();return}
  endDay()}
const stars=n=>'\u2605'.repeat(n)+'\u2606'.repeat(5-n);
function receiptHTML(x){return `<div class="receipt"><div class="rh">The Loveborne Witch\u2019s Emporium</div><div>Day ${S.day} \u00B7 ${esc(x.hour)}</div><hr><div><b>${esc(x.who||'A customer')}</b></div><div>${esc(x.item||'')}</div><div class="rs" aria-label="${SCORE[x.g]} of 5 stars">${stars(SCORE[x.g])}</div></div>`}
function endDay(){const before=rating(),reviews=S.pend.splice(0);
  reviews.forEach(x=>S.hist.push(SCORE[x.g]));S.hist=S.hist.slice(-20);const after=rating();
  const body=$('#dayEndBody');
  const last=S.day>=7;
  body.innerHTML=`<h2>${last?'End of the first week':'The shop closes for the night'}</h2>
  <h3>Today's receipts</h3>${reviews.length?`<div class="receipts">${reviews.map(receiptHTML).join('')}</div>`:'<p class="muted">No sales today.</p>'}
  <p>Rating: ${before.toFixed(1)} \u2192 <b>${after.toFixed(1)}</b> of 5 (${S.hist.length?`average of the last ${S.hist.length} review${S.hist.length===1?'':'s'}`:'no reviews yet'}; Good work tops out at 4)</p>
  <p class="muted">How things turned out, customers will tell you when they next come in.</p>
  ${last?summaryHTML():''}
  <div class="row"><button class="main" id="dayGo">${last?'Start over':'Open the shop on Day '+(S.day+1)}</button></div>`;
  $('#dayEnd').classList.add('open');
  $('#dayGo').onclick=()=>{$('#dayEnd').classList.remove('open');
    if(last){S=fresh()}else{S.day++;S.h=0;S.tests=3;S.altar=[];S.candle='';S.tarot=''}
    render()}}
function summaryHTML(){const s=S.stats;const locked=Object.keys(D.recipes).filter(id=>recipeLocked(id)).length;
  const pend=S.orders.filter(o=>o.status==='waiting').map(o=>D.recipes[o.rid].name);
  return `<h3>Your week</h3><p>Orders by stars: \u2605\u2605\u2605\u2605\u2605 ${s.perfect}, \u2605\u2605\u2605\u2605 ${s.good}, \u2605\u2605 ${s.clumsy}, \u2605 ${s.failed}. Advice given ${s.advice}. Customers who left empty-handed ${s.missed}.</p>
  <p>Words collected: ${S.bank.length}. Recipes solved in the Recipe Book: ${locked} of ${Object.keys(D.recipes).length}.</p>
  ${pend.length?`<p>Still to collect: ${pend.map(esc).join(', ')} (Tobias will fetch it next week).</p>`:''}
  ${S.tales.length?`<p>Stories you haven't heard yet: ${S.tales.length}. They'll come up next week.</p>`:''}`}

/* ---------- books ---------- */
const BOOKS=['Letters','Herbiary','Crystal Almanac','Gentle Bestiary','Tarot Companion','Almanac of Sky & Seasons','Grimoire of Craft','Recipe Book'];
const az=a=>[...a].sort((x,y)=>x.localeCompare(y));
/* Almanac categories (alphabetical); entries keep their natural order where there is one. */
const ALMANAC=[['Festivals',D.sabbats.map(s=>s[0])],['Magic Hours',HOURS],
 ['Moon Phases',['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent','Dark Moon']],
 ['Named Moons',['Wolf Moon','Snow Moon','Worm Moon','Pink Moon','Flower Moon','Strawberry Moon','Buck Moon','Sturgeon Moon','Harvest Moon',"Hunter's Moon",'Beaver Moon','Cold Moon']],
 ['Sky Events',az(['Blue Moon','Clear starry night','Lunar Eclipse','Rainbow','Shooting stars'])],
 ['Weather',az(['Clear & sunny','Rain','After Rain','Thunderstorm','Fog / Mist','Windy','Snow'])],
 ['Weekdays',D.days.map(d=>d[0])]];
let curBook='Letters',selWord=null;
/* Each book remembers its own search, across closing the shelf and switching books. */
const searchOf=()=>((S.search||(S.search={}))[curBook]||'');
function entryList(book){const L=[];const add=(k,props,note,always)=>L.push({k,props,note,always});
  const cats={Herbiary:['Base waters','Oils, butters & waxes','Herbs & flowers','Fruits','Spices','Pantry: salts, sugars & baking','Resins & incense'],'Crystal Almanac':['Crystals'],'Gentle Bestiary':['Animal gifts']};
  if(cats[book])D.items.filter(i=>cats[book].includes(i.c)).sort((a,b)=>a.c.localeCompare(b.c)||a.n.localeCompare(b.n)).forEach(i=>{add(i.n,i.props,i.base.length?'Base for '+i.base.join(', '):'',false);L[L.length-1].cat=cats[book].length>1?i.c:''});
  if(book==='Tarot Companion')Object.entries(D.tarot).forEach(([k,p])=>add(k,p,'',false));
  if(book==='Almanac of Sky & Seasons')ALMANAC.forEach(([cat,names])=>names.forEach(k=>{
    const sb=D.sabbats.find(x=>x[0]===k),dy=D.days.find(x=>x[0]===k);
    add(k,D.cond[k]||[],sb?sb[1]:dy?`${dy[1]}; colours ${dy[2].toLowerCase()}`:'',!D.condUsed.includes(k));L[L.length-1].cat=cat}));
  if(book==='Grimoire of Craft'){
    az(Object.keys(D.colours)).forEach(c=>{add(c,D.colours[c],'Candles, threads and inks',false);L[L.length-1].cat='Colours'});
    az(Object.keys(D.methods)).forEach(t=>{const m=D.methods[t];L.push({k:t,props:[],note:`${m.where}. ${m.how}`,method:true,cat:'Making Methods'})});
    D.items.filter(i=>['Buttons','Wood & branches','Findings & tools','Threads & ribbons'].includes(i.c)&&!/ thread$/.test(i.n)&&i.props.length&&!(/ ink$| paint$/.test(i.n))).sort((a,b)=>a.n.localeCompare(b.n)).forEach(i=>{add(i.n,i.props,'',false);L[L.length-1].cat='Symbols & Charms'})}
  return L}
function hiddenOf(e){if(e.always||e.method||!e.props.length)return[];return e.props.length===1?[e.props[0]]:e.props.slice(1)}
function shownOf(e){if(e.always)return e.props;if(e.props.length<=1)return[];return[e.props[0]]}
function entryLocked(e){const h=hiddenOf(e);if(!h.length)return false;const f=(S.fills[e.k]||[]);return h.every(w=>f.includes(w))&&f.filter(Boolean).length===h.length}
function openBooks(){$('#books').classList.add('open');$('#search').value=searchOf();renderBooks();autoTick()}
function renderBooks(){
  $('#booktabs').innerHTML=BOOKS.map(b=>`<button aria-pressed="${b===curBook}" data-book="${esc(b)}">${esc(b)}</button>`).join('');
  $('#bank').innerHTML=S.bank.length?S.bank.slice().sort().map(w=>`<button class="word ${selWord===w?'sel':''}" data-word="${esc(w)}">${esc(w)}</button>`).join(''):'<span class="muted">No words yet. Read the letters and try test crafts.</span>';
  const q=($('#search').value||'').toLowerCase();const el=$('#entries');
  if(curBook==='Letters'){el.innerHTML=D.letters.map((l,i)=>`<div class="letter"><h3>${esc(l.title)}</h3>${S.letters[i]?l.lines.map(x=>`<p>${esc(x)}</p>`).join(''):`<button data-letter="${i}">Open the letter</button>`}</div>`).join('');return}
  if(curBook==='Recipe Book'){el.innerHTML=Object.values(D.recipes).filter(r=>!q||r.name.toLowerCase().includes(q)).map(recipeHTML).join('');return}
  let lastCat='';
  el.innerHTML=entryList(curBook).filter(e=>!q||e.k.toLowerCase().includes(q)).map(e=>{
    const head=e.cat&&e.cat!==lastCat?`<h3 class="cat">${esc(lastCat=e.cat)}</h3>`:'';return head+(()=>{
    if(e.method)return `<div class="entry"><b>${esc(e.k)}</b><span class="muted">${esc(e.note)}</span></div>`;
    const h=hiddenOf(e),f=S.fills[e.k]||[];
    const lk=entryLocked(e);const blanks=h.map((_,i)=>`<button class="blank ${f[i]?'filled':''}" data-entry="${esc(e.k)}" data-i="${i}" aria-label="${f[i]?'Filled blank: tap to clear':'Blank'}" ${lk?'disabled':''}>${f[i]?esc(f[i]):'\u00A0'}</button>`).join(' ');
    return `<div class="entry ${entryLocked(e)?'locked':''}"><b>${esc(e.k)}</b>${shownOf(e).map(esc).join(' \u00B7 ')}${shownOf(e).length&&h.length?' \u00B7 ':''}${blanks}${e.note?`<span class="muted" style="margin-left:auto;font-size:13px">${esc(e.note)}</span>`:''}${ITEM[e.k]?.line?`<span class="bookline">${esc(ITEM[e.k].line)}</span>`:''}</div>`})()}).join('')||'<p class="muted">Nothing matches.</p>'}
const CONDKIND={day:'Weekday',phase:'Moon Phase',pg:'Moon Phase',dark:'Moon Phase',time:'Magic Hour',weather:'Weather',afterrain:'Weather',starry:'Sky Event',sabbat:'Festival',named:'Named Moon'};
const KINDOPTS={'Weekday':D.days.map(d=>d[0]),'Moon Phase':['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent','Waxing Moon','Waning Moon','Dark Moon'],
 'Magic Hour':HOURS,'Weather':['after Rain','Clear & sunny','Fog / Mist','Rain','Snow','Thunderstorm','Windy'],'Sky Event':az(['Blue Moon','Clear starry night','Lunar Eclipse','Rainbow','Shooting stars']),
 'Festival':D.sabbats.map(s=>s[0]),'Named Moon':ALMANAC[3][1]};
function noteOf(id){return S.notes[id]||(S.notes[id]={ing:[],candle:'',tarot:'',when:[]})}
function recipeLocked(id){const r=D.recipes[id],n=S.notes[id];if(!n)return false;const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
  return same(n.ing,r.ing)&&n.candle===(r.candle||'')&&n.tarot===(r.tarot||'')&&same(n.when.filter(Boolean),r.conds.map(condName))}
function recipeHTML(r){const n=noteOf(r.id);const lk=recipeLocked(r.id);const N=r.ing.length,M=r.conds.length;
  const chips=(arr,attr)=>arr.map(x=>lk?`<span class="chip on">${esc(x)}</span>`:`<button class="chip" data-${attr}="${r.id}|${esc(x)}">${esc(x)} ×</button>`).join(' ');
  const pick=(attr,label,opts)=>`<select data-${attr}="${r.id}" aria-label="${label}"><option value="">add…</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  const one=(attr,want,val,opts,label)=>!want?'<span class="muted">none needed</span>':lk?esc(val):`<select data-${attr}="${r.id}" aria-label="${label}"><option value="">?</option>${opts.map(c=>`<option ${val===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  return `<div class="recipe ${lk?'locked':''}"><h3 style="margin-top:0">#${r.id} ${esc(r.name)}${lk?' ✦':''}</h3><div class="muted">${esc(r.type)}. ${esc(r.intent)}.</div><div><b>Themes:</b> ${r.themes.map(esc).join(', ')}</div>
  <div><b>Ingredients (${n.ing.length}/${N}):</b> ${chips(n.ing,'rm-ing')} ${!lk&&n.ing.length<N?pick('add-ing','Add ingredient',D.items.map(i=>i.n)):''}</div>
  <div class="row"><b>Candle:</b>${one('set-candle',r.candle,n.candle,Object.keys(D.colours),'Candle')}
  <b>Card:</b>${one('set-tarot',r.tarot,n.tarot,Object.keys(D.tarot),'Card')}</div>
  <div><b>When${M?` (${n.when.filter(Boolean).length}/${M})`:''}:</b> ${M?r.conds.map((c,i)=>{const kind=CONDKIND[c.t],v=n.when[i];
    return v?(lk?`<span class="chip on">${esc(v)}</span>`:`<button class="chip" data-rm-when="${r.id}|${i}">${esc(v)} \u00D7</button>`)
      :`<select data-add-when="${r.id}|${i}" aria-label="${kind}"><option value="">${kind}\u2026</option>${KINDOPTS[kind].map(o=>`<option>${esc(o)}</option>`).join('')}</select>`}).join(' '):'<span class="muted">any time</span>'}</div>${r.conds.some(c=>c.t==='named')?'<div class="muted" style="font-size:13px">Needs one particular full moon, chosen by name. A plain Full Moon won\u2019t do.</div>':''}</div>`}
$('#books').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.book){curBook=b.dataset.book;$('#search').value=searchOf();renderBooks();return}
  if(b.dataset.word){selWord=selWord===b.dataset.word?null:b.dataset.word;renderBooks();return}
  if(b.dataset.letter!==undefined){const i=+b.dataset.letter;S.letters[i]=true;addWords(X.letterWords[i]||[]);
    if(i===2){[[95,true],[153,true],[111,false]].forEach(([id,full])=>{const r=D.recipes[id],n=noteOf(id);
      if(full){n.ing=[...r.ing];n.candle=r.candle;n.tarot=r.tarot;n.when=r.conds.map(condName)}else{n.ing=['Ash wood','Ink','Raven feather'];n.candle='Purple'}})}
    save();renderBooks();return}
  if(b.dataset.entry){const k=b.dataset.entry,i=+b.dataset.i;const f=S.fills[k]||(S.fills[k]=[]);
    if(selWord){f[i]=selWord;const e=entryList(curBook).find(x=>x.k===k);if(e&&entryLocked(e)){toast(`${k} is complete \u2726`)}}else if(f[i]){f[i]=undefined}else{toast('Pick a word from the word bank first.')}
    save();renderBooks();return}
  if(b.dataset.rmIng){const[id,x]=b.dataset.rmIng.split('|');const n=noteOf(id);n.ing=n.ing.filter(y=>y!==x);save();renderBooks();return}
  if(b.dataset.rmWhen){const[id,i]=b.dataset.rmWhen.split('|');noteOf(id).when[+i]='';save();renderBooks();return}
});
$('#books').addEventListener('change',e=>{const t=e.target;
  if(t.id==='search')return;  /* the search box's change-on-blur would redraw the tabs mid-click */
  if(t.dataset.addIng&&t.value){const n=noteOf(t.dataset.addIng);if(!n.ing.includes(t.value))n.ing.push(t.value)}
  if(t.dataset.addWhen&&t.value){const[wid,wi]=t.dataset.addWhen.split('|');noteOf(wid).when[+wi]=t.value}
  if(t.dataset.setCandle!==undefined)noteOf(t.dataset.setCandle).candle=t.value;
  if(t.dataset.setTarot!==undefined)noteOf(t.dataset.setTarot).tarot=t.value;
  const id=t.dataset.addIng||(t.dataset.addWhen||'').split('|')[0]||t.dataset.setCandle||t.dataset.setTarot;
  if(id&&recipeLocked(id))toast('Recipe solved \u2726');
  save();renderBooks()});
$('#search').addEventListener('input',e=>{(S.search||(S.search={}))[curBook]=e.target.value;save();renderBooks()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#books').classList.remove('open');render()}});
render();
</script>
</body>
</html>
