<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Scene Test</title>
<style>
  /* A test of the shop scene: one background plate, and each counter object as its own layer.
     Positions are percentages of the scene, so everything scales together with the window. */
  :root { --glow: #ffd6f0; }
  html, body { margin: 0; height: 100%; background: #2a1b19; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }

  .scene {
    position: relative;
    width: min(100vw, calc(100vh * 1376 / 768));
    aspect-ratio: 1376 / 768;
    background: url("assets/scene/background.jpg") center / cover no-repeat;
    overflow: hidden;
  }

  /* Every object sits on the tablecloth: "bottom" is how high its base is above the bottom edge. */
  .obj {
    position: absolute;
    display: block;
    padding: 0; border: 0; background: none; cursor: pointer;
    transform-origin: 50% 100%;
    transition: transform .15s ease, filter .15s ease;
    filter: drop-shadow(0 6px 4px rgba(60, 20, 30, .35));
  }
  .obj img { display: block; width: 100%; height: auto; }
  .obj:hover, .obj:focus-visible {
    transform: translateY(-1.5%) scale(1.03);
    filter: drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 14px var(--glow)) drop-shadow(0 6px 4px rgba(60, 20, 30, .35));
    outline: none;
  }

  /* Left to right along the counter. */
  .books    { left: 1.5%;  bottom: 9%;  width: 17%;  z-index: 2; }
  .crystal  { left: 16.5%; bottom: 13%; width: 10%;  z-index: 1; }
  .till     { left: 25%;   bottom: 10%; width: 17%;  z-index: 2; }
  .notebook { left: 40%;   bottom: 8%;  width: 16%;  z-index: 3; }
  .bell     { left: 56.5%; bottom: 12%; width: 7%;   z-index: 2; }
  .computer { left: 63%;   bottom: 7%;  width: 30%;  z-index: 1; }

  /* Stand-ins until the bell and computer images are added. */
  .slot {
    border: 2px dashed rgba(255, 230, 240, .8); border-radius: 8px;
    color: #fff3f8; font-size: clamp(10px, 1.2vw, 16px); display: flex; align-items: center; justify-content: center;
    background: rgba(90, 40, 60, .25);
  }
  .bell.slot { aspect-ratio: 1 / 1.6; }
  .computer.slot { aspect-ratio: 1.35 / 1; }

  .label {
    position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%);
    background: rgba(40, 20, 30, .75); color: #fff; padding: 4px 12px; border-radius: 999px;
    font-size: clamp(11px, 1.1vw, 15px); pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  .label.on { opacity: 1; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <button class="obj books"    data-label="Books"><img src="assets/scene/books.png" alt="A stack of the nine books"></button>
  <button class="obj crystal"  data-label="Crystal ball (auras)"><img src="assets/scene/crystal-ball.png" alt="Crystal ball"></button>
  <button class="obj till"     data-label="Till (receipts)"><img src="assets/scene/till.png" alt="Till"></button>
  <button class="obj notebook" data-label="Notebook (letters and notes)"><img src="assets/scene/notebook.png" alt="Open notebook and pen"></button>
  <div class="obj bell slot"     data-label="Bell">bell</div>
  <div class="obj computer slot" data-label="Computer">computer</div>
  <div class="label" id="label"></div>
</div>
<script>
  // Hovering an object shows its name; this is only a layout test.
  const label = document.getElementById('label');
  document.querySelectorAll('.obj').forEach(o => {
    o.addEventListener('mouseenter', () => { label.textContent = o.dataset.label; label.classList.add('on'); });
    o.addEventListener('mouseleave', () => label.classList.remove('on'));
  });
</script>
</body>
</html>
